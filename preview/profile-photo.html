<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UWFL profielfoto beheren</title><style>body{font:17px system-ui;background:#f6f7f2;color:#17211f;margin:0;padding:30px}main{max-width:600px;margin:auto;background:white;padding:28px;border-radius:12px}label{display:block;margin:18px 0}input,button{font:inherit;padding:12px;box-sizing:border-box;max-width:100%}button{cursor:pointer}img{display:block;max-width:100%;max-height:420px;object-fit:contain;margin-top:20px}[hidden]{display:none!important}</style><main><a href="admin.html">← UWFL-beheer</a><h1>Profielfoto beheren</h1><form id="login"><label>Beheerwachtwoord <input name="password" type="password" autocomplete="current-password" required></label><button>Inloggen</button></form><form id="upload" hidden><label>Profielnummer <input name="id" type="number" required value="40"></label><label>Volledige profielnaam <input name="name" required value="Steve Osborn"></label><label>Profielfoto <input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label><button>Foto opslaan</button></form><p id="status" role="status"></p><img id="preview" hidden alt="Nieuwe profielfoto"><script src="assets/profile-photo.js"></script></main></html>
