<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UWFL profielfoto beheren</title><style>body{font:17px system-ui;background:#f6f7f2;color:#17211f;margin:0;padding:30px}main{max-width:600px;margin:auto;background:white;padding:28px;border-radius:12px}label{display:block;margin:18px 0}input,button{font:inherit;padding:12px;box-sizing:border-box;max-width:100%}button{cursor:pointer}img{display:block;max-width:100%;max-height:420px;object-fit:contain;margin-top:20px}[hidden]{display:none!important}</style><main><a href="admin.html">← UWFL-beheer</a><h1>Profielfoto beheren</h1><form id="login"><label>Beheerwachtwoord <input name="password" type="password" autocomplete="current-password" required></label><button>Inloggen</button></form><form id="upload" hidden><label>Profielnummer <input name="id" type="number" required value="40"></label><label>Volledige profielnaam <input name="name" required value="Steve Osborn"></label><label>Profielfoto <input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label><button>Foto opslaan</button></form><p id="status" role="status"></p><img id="preview" hidden alt="Nieuwe profielfoto"><script>
(()=>{'use strict';let key='';const login=document.getElementById('login'),upload=document.getElementById('upload'),status=document.getElementById('status'),preview=document.getElementById('preview');
login.onsubmit=async e=>{e.preventDefault();const input=login.elements.password;const candidate=input.value;input.value='';status.textContent='Aanmelden…';try{const r=await fetch('/.netlify/functions/admin-pending',{headers:{'X-Admin-Key':candidate},credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('Inloggen mislukt');key=candidate;login.hidden=true;upload.hidden=false;status.textContent='Ingelogd. Controleer de profielnaam en kies de foto.';}catch(err){status.textContent=err.message;}};
upload.onsubmit=async e=>{e.preventDefault();const file=upload.elements.photo.files[0];if(!file||file.size>4*1024*1024){status.textContent='Kies een JPG, PNG of WebP van maximaal 4 MB.';return;}const button=upload.querySelector('button');button.disabled=true;status.textContent='Foto opslaan…';try{const fileData=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});const r=await fetch('/.netlify/functions/admin-profile-photo',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({id:upload.elements.id.value,name:upload.elements.name.value.trim(),fileType:file.type,fileData})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'Opslaan mislukt');status.textContent='Profielfoto opgeslagen voor '+data.name;preview.src=data.photo_url;preview.hidden=false;upload.hidden=true;key='';}catch(err){status.textContent=err.message;}finally{button.disabled=false;}};
window.addEventListener('pagehide',()=>{key='';});
})();</script></main></html>
