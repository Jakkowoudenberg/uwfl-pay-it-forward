<!DOCTYPE html>
<html>
<head>
<title>UWFL Admin — Photo Upload</title>
<style>
body{font-family:Inter,sans-serif;background:#0d0a07;color:#fff;padding:2rem;max-width:500px;margin:0 auto}
h1{color:#c49a6c;font-size:1.4rem}
select{width:100%;padding:.6rem;margin:.4rem 0 1rem;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#fff;color:#1a0f05;font-size:14px;box-sizing:border-box}
button{background:#c49a6c;color:#1a0f05;border:none;padding:.75rem 2rem;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:.5rem}
#dropzone{border:2px dashed rgba(255,255,255,.3);border-radius:12px;padding:2rem;text-align:center;cursor:pointer;transition:all .2s;margin:.4rem 0 1rem;color:rgba(255,255,255,.5);font-size:14px}
#dropzone.hover{border-color:#c49a6c;background:rgba(196,154,108,.1);color:#c49a6c}
#dropzone.has-photo{border-color:#c49a6c;border-style:solid}
#preview{width:100px;height:100px;border-radius:50%;object-fit:cover;border:2px solid #c49a6c;display:none;margin:.5rem auto}
#status{margin-top:1rem;padding:1rem;border-radius:8px;font-size:13px;display:none}
label{font-size:12px;color:rgba(255,255,255,.7);display:block;margin-bottom:2px}
#loading{color:rgba(255,255,255,.5);font-size:13px;margin:.5rem 0}
</style>
</head>
<body>
<h1>📷 UWFL Photo Upload</h1>

<label>Deelnemer</label>
<div id="loading">⏳ Deelnemers laden...</div>
<select id="name" style="display:none">
<option value="">-- Selecteer deelnemer --</option>
</select>

<label>Foto — sleep hiernaartoe of klik om te kiezen</label>
<div id="dropzone" onclick="document.getElementById('fileInput').click()">
  📷 Sleep foto hier of klik om te kiezen
  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
</div>
<img id="preview" src="" style="display:none">

<button onclick="upload()">📤 Upload foto</button>
<div id="status"></div>

<script>
var compressed = null;

// Load participants from live API
fetch('/.netlify/functions/participants')
  .then(function(r){ return r.json(); })
  .then(function(data){
    var sel = document.getElementById('name');
    var loading = document.getElementById('loading');
    
    // Sort by name
    data.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    
    data.forEach(function(p){
      if(!p.name) return;
      var opt = document.createElement('option');
      opt.value = p.name;
      opt.textContent = p.name + (p.company ? ' — ' + p.company : '') + (p.photo_url ? ' ✓' : '');
      sel.appendChild(opt);
    });
    
    loading.style.display = 'none';
    sel.style.display = 'block';
  })
  .catch(function(e){
    document.getElementById('loading').textContent = '✗ Kon deelnemers niet laden: ' + e.message;
  });

// Drag & drop
var dz = document.getElementById('dropzone');
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('hover'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('hover'); });
dz.addEventListener('drop', function(e){
  e.preventDefault();
  dz.classList.remove('hover');
  var file = e.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')) handleFile(file);
});

function handleFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var imgEl = new Image();
    imgEl.onload = function(){
      var canvas = document.createElement('canvas');
      var MAX = 800;
      var w = imgEl.width, h = imgEl.height;
      if(w > h){ if(w > MAX){ h = Math.round(h*MAX/w); w = MAX; } }
      else { if(h > MAX){ w = Math.round(w*MAX/h); h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(imgEl, 0, 0, w, h);
      compressed = canvas.toDataURL('image/jpeg', 0.85);
      var prev = document.getElementById('preview');
      prev.src = compressed;
      prev.style.display = 'block';
      dz.innerHTML = '✓ ' + file.name + ' — klaar om te uploaden<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">';
      dz.classList.add('has-photo');
    };
    imgEl.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function upload(){
  var name = document.getElementById('name').value;
  var status = document.getElementById('status');
  if(!name){ alert('Selecteer een deelnemer'); return; }
  if(!compressed){ alert('Kies een foto'); return; }
  
  status.style.display = 'block';
  status.style.background = 'rgba(255,255,255,.1)';
  status.textContent = '⏳ Uploading...';

  fetch('/.netlify/functions/admin-upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': 'UWFL2024admin' },
    body: JSON.stringify({ participantName: name, fileData: compressed })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.url){
      status.style.background = 'rgba(100,200,100,.2)';
      status.textContent = '✓ Gelukt! ' + name + ' heeft nu een foto.';
      // Update option to show checkmark
      var opts = document.getElementById('name').options;
      for(var i=0; i<opts.length; i++){
        if(opts[i].value === name && opts[i].textContent.indexOf('✓') === -1){
          opts[i].textContent += ' ✓';
        }
      }
      compressed = null;
      document.getElementById('preview').style.display = 'none';
      dz.innerHTML = '📷 Sleep foto hier of klik om te kiezen<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">';
      dz.classList.remove('has-photo');
    } else {
      status.style.background = 'rgba(200,100,100,.2)';
      status.textContent = '✗ Fout: ' + JSON.stringify(d);
    }
  })
  .catch(function(e){
    status.style.background = 'rgba(200,100,100,.2)';
    status.textContent = '✗ Fout: ' + e.message;
  });
}
</script>
</body>
</html>
