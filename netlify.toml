[[redirects]]
  from = "https://unitedwoodfloorlayers.netlify.app/*"
  to = "https://unitedwoodfloorlayers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.unitedwoodfloorlayers.com/*"
  to = "https://unitedwoodfloorlayers.com/:splat"
  status = 301
  force = true

# Move app entry pages while keeping API calls and service-worker updates
# available to people who still have an older app tab or installation open.
[[redirects]]
  from = "https://app.unitedwoodfloorlayers.com/"
  to = "https://unitedwoodfloorlayers.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://app.unitedwoodfloorlayers.com/index.html"
  to = "https://unitedwoodfloorlayers.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://app.unitedwoodfloorlayers.com/admin.html"
  to = "https://unitedwoodfloorlayers.com/admin.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

[build]
  command = "node scripts/build-production.cjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
