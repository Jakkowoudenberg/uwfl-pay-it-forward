<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>United Wood Floor Layers — Pay It Forward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0705; --bg2: #120e0a; --bg3: #1c1510;
  --wood: #c49a6c; --wood-dim: #7a5030;
  --amber: #e8902a; --amber-glow: rgba(232,144,42,0.1);
  --text: #f0e8dc; --text-dim: rgba(240,232,220,0.55); --text-faint: rgba(240,232,220,0.28);
  --border: rgba(196,154,108,0.14); --border-s: rgba(196,154,108,0.28);
}
html, body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overflow: hidden;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px; opacity: 0.03; pointer-events: none; z-index: 9999;
}

.app {
  max-width: 680px; margin: 0 auto;
  height: 100dvh; height: 100vh;
  display: flex; flex-direction: column;
  position: relative;
}

/* ========== INTRO (Nachtwacht-style: full screen, centered) ========== */
#intro {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem 2rem 1.5rem; text-align: center;
  position: relative; overflow: hidden;
}
#intro.hidden { display: none; }

.intro-ring {
  position: absolute; width: 380px; height: 380px;
  border-radius: 50%; border: 1px solid rgba(196,154,108,0.06);
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  pointer-events: none;
}
.intro-ring::after {
  content: ''; position: absolute; inset: 40px;
  border-radius: 50%; border: 1px solid rgba(196,154,108,0.035);
}

.intro-label {
  font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--wood);
  margin-bottom: 1rem; font-weight: 500; position: relative;
}
.intro-title {
  font-size: clamp(1.9rem, 7.5vw, 3.2rem);
  font-weight: 700; color: var(--text);
  line-height: 1.08; letter-spacing: -0.03em;
  position: relative; margin-bottom: 0.4rem;
}
.intro-title em { font-style: italic; font-weight: 300; color: var(--wood); }
.intro-sub {
  font-size: 14px; color: var(--text-dim);
  line-height: 1.65; font-weight: 300;
  max-width: 300px; margin: 0.75rem auto 0;
  position: relative;
}

/* planks divider */
.planks {
  display: flex; height: 3px; gap: 2px;
  width: 100%; margin: 1.5rem 0; position: relative;
}
.pl { flex: 1; border-radius: 1px; }
.pl:nth-child(1){background:#3d2208}.pl:nth-child(2){background:#6e3e1a}
.pl:nth-child(3){background:#9c6230}.pl:nth-child(4){background:#5a3012}
.pl:nth-child(5){background:#2e1a06}.pl:nth-child(6){background:#7c4e22}
.pl:nth-child(7){background:#4e2c10}.pl:nth-child(8){background:#b87840}
.pl:nth-child(9){background:#3a1e08}.pl:nth-child(10){background:#8a5828}

/* TAP TO SPEAK style main button */
.tap-btn {
  width: 90px; height: 90px; border-radius: 50%;
  background: transparent;
  border: 1.5px solid var(--border-s);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.25s;
  position: relative; margin: 0 auto 0.6rem;
  color: var(--text-dim); font-size: 12px;
  font-family: 'Inter', sans-serif; font-weight: 400;
  letter-spacing: 0.04em;
  flex-direction: column; gap: 4px;
}
.tap-btn::before {
  content: '';
  position: absolute; inset: -8px;
  border-radius: 50%; border: 1px solid rgba(196,154,108,0.1);
}
.tap-btn:hover { border-color: var(--wood); color: var(--wood); background: rgba(196,154,108,0.04); }
.tap-btn-icon { font-size: 24px; line-height: 1; }
.tap-btn-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }

/* topic pills — always visible on intro */
.intro-topics-section {
  width: 100%; position: relative; margin-top: 0.5rem;
}
.intro-topics-scroll {
  display: flex; gap: 7px;
  overflow-x: auto; padding: 4px 0 2px;
  scrollbar-width: none; flex-wrap: wrap;
  justify-content: center;
}
.intro-topics-scroll::-webkit-scrollbar { display: none; }
.intro-topic {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 13px;
  font-size: 12.5px; color: var(--text-dim);
  cursor: pointer; white-space: nowrap;
  font-family: 'Inter', sans-serif; font-weight: 400;
  transition: all 0.15s;
}
.intro-topic:hover { border-color: var(--wood); color: var(--wood); }

/* ========== CHAT ========== */
#chat {
  flex: 1; display: none; flex-direction: column;
  overflow: hidden; height: 100dvh; height: 100vh;
}
#chat.active { display: flex; }

.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-header-left { display: flex; flex-direction: column; }
.chat-header-label {
  font-size: 9px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--wood-dim); font-weight: 500;
}
.chat-header-title {
  font-size: 15px; font-weight: 600;
  color: var(--text); letter-spacing: -0.01em; margin-top: 2px;
}
.header-back {
  background: transparent; border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 12px;
  font-family: 'Inter', sans-serif; font-size: 12px;
  color: var(--text-dim); cursor: pointer; transition: all 0.15s;
}
.header-back:hover { border-color: var(--wood); color: var(--text); }

.chat-messages {
  flex: 1; overflow-y: auto; padding: 1.5rem;
  display: flex; flex-direction: column; gap: 1.2rem;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.msg { display: flex; gap: 10px; animation: rise 0.3s ease; }
@keyframes rise { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }
.msg.user { flex-direction: row-reverse; }
.msg-av {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.msg-bub {
  max-width: 80%; padding: 0.7rem 1rem;
  font-size: 14px; line-height: 1.72; font-weight: 300; border-radius: 12px;
}
.msg.ai .msg-bub {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 4px 12px 12px 12px;
}
.msg.user .msg-bub {
  background: var(--wood); color: var(--bg);
  font-weight: 500; border-radius: 12px 4px 12px 12px;
}

/* info cards */
.info-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.5rem; animation: rise 0.3s ease;
}
.info-card h3 {
  font-size: 11px; font-weight: 600; color: var(--wood);
  letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 1rem;
}
.info-card p {
  font-size: 14px; line-height: 1.75; color: var(--text-dim);
  font-weight: 300; margin-bottom: 0.6rem;
}
.info-card p:last-child { margin-bottom: 0; }
.info-card strong { color: var(--text); font-weight: 500; }
.info-stat-row { display: flex; gap: 8px; margin-bottom: 0.75rem; }
.info-stat {
  flex: 1; background: var(--bg2); border-radius: 8px;
  padding: 0.75rem; text-align: center;
}
.info-stat-n { font-size: 1.5rem; font-weight: 700; color: var(--wood); display: block; line-height: 1; }
.info-stat-l { font-size: 10px; color: var(--text-faint); display: block; margin-top: 4px; }
.country-row {
  display: flex; align-items: center;
  justify-content: space-between; padding: 8px 0;
  border-bottom: 1px solid var(--border); font-size: 13px;
}
.country-row:last-child { border-bottom: none; }
.country-bar-wrap { flex: 1; margin: 0 12px; }
.country-bar { height: 2px; background: var(--wood-dim); border-radius: 1px; }
.quote-card {
  border-left: 2px solid var(--amber); padding: 0.875rem 1rem;
  background: var(--amber-glow); border-radius: 0 8px 8px 0;
  font-style: italic; font-size: 14px; color: var(--text);
  line-height: 1.65; margin: 0.75rem 0; animation: rise 0.3s ease;
}

/* join form */
.join-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.5rem; animation: rise 0.3s ease;
}
.join-card h3 {
  font-size: 11px; font-weight: 600; color: var(--wood);
  letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 1.25rem;
}
.route-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.25rem; }
.route-btn {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.875rem 0.75rem;
  cursor: pointer; text-align: left; transition: all 0.15s;
  font-family: 'Inter', sans-serif;
}
.route-btn:hover { border-color: var(--wood-dim); }
.route-btn.sel { border-color: var(--wood); background: rgba(196,154,108,0.08); }
.route-icon { font-size: 18px; margin-bottom: 5px; display: block; }
.route-title { font-size: 13px; font-weight: 600; color: var(--text); display: block; margin-bottom: 3px; }
.route-sub { font-size: 11px; color: var(--text-faint); line-height: 1.4; display: block; }
.field { margin-bottom: 0.85rem; }
.field label { display: block; font-size: 11px; color: var(--text-faint); margin-bottom: 4px; letter-spacing: 0.04em; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg2);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 0.6rem 0.875rem; font-family: 'Inter', sans-serif;
  font-size: 14px; color: var(--text); outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--wood-dim); }
.field select option { background: var(--bg2); }
.field textarea { resize: vertical; min-height: 65px; }
#join-fields { display: none; }
.join-submit {
  width: 100%; background: var(--wood); color: var(--bg);
  border: none; border-radius: 8px; padding: 0.8rem;
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; margin-top: 0.5rem;
}
.join-submit:hover { background: var(--amber); }
.join-hint { font-size: 11px; color: var(--text-faint); text-align: center; margin-top: 0.6rem; line-height: 1.5; }

/* typing */
.typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
.typing span {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--wood-dim); animation: blink 1.2s ease infinite;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ===== TOPIC BUTTONS row in chat (Nachtwacht style) ===== */
.chat-topics-bar {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  padding: 0.6rem 1.5rem 0.5rem;
}
.chat-topics-label {
  font-size: 9px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-faint); margin-bottom: 0.5rem;
}
.chat-topics-scroll {
  display: flex; gap: 6px; overflow-x: auto;
  padding-bottom: 2px; scrollbar-width: none;
}
.chat-topics-scroll::-webkit-scrollbar { display: none; }
.chat-topic {
  flex-shrink: 0;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 18px; padding: 5px 12px;
  font-size: 12px; color: var(--text-dim);
  cursor: pointer; white-space: nowrap;
  font-family: 'Inter', sans-serif; transition: all 0.15s;
}
.chat-topic:hover { border-color: var(--wood); color: var(--wood); }

/* chat input */
.chat-input-wrap {
  padding: 0.6rem 1.5rem 1.2rem; flex-shrink: 0;
}
.chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
.chat-input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.65rem 1rem;
  font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text);
  outline: none; resize: none; min-height: 42px; max-height: 110px;
  overflow-y: auto; transition: border-color 0.15s; line-height: 1.5;
}
.chat-input:focus { border-color: var(--wood-dim); }
.chat-input::placeholder { color: var(--text-faint); }
.send-btn {
  width: 42px; height: 42px; background: var(--wood); border: none;
  border-radius: 10px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  font-size: 17px; color: var(--bg); flex-shrink: 0; transition: all 0.15s;
}
.send-btn:hover { background: var(--amber); }
.send-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div class="app">

<!-- ========== INTRO ========== -->
<div id="intro">
  <div class="intro-ring"></div>
  <div class="intro-label">Dutch Wood Artist · Pay It Forward</div>
  <div class="intro-title">
    One world<br>
    Many people<br>
    <em>One Artfloor</em>
  </div>
  <div class="intro-sub">Een wereldwijde beweging van makers en mensen.</div>

  <div class="planks">
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div>
  </div>

  <button class="tap-btn" onclick="openChat()">
    <span class="tap-btn-icon">💬</span>
    <span class="tap-btn-label">Tap to chat</span>
  </button>

  <div class="intro-topics-section">
    <div class="intro-topics-scroll">
      <button class="intro-topic" onclick="quickChat('project')">📋 Wat is dit?</button>
      <button class="intro-topic" onclick="quickChat('meedoen')">✋ Hoe meedoen?</button>
      <button class="intro-topic" onclick="quickChat('paneel')">🪵 Het paneel</button>
      <button class="intro-topic" onclick="quickChat('3mensen')">🤝 Help 3 mensen</button>
      <button class="intro-topic" onclick="quickChat('ketting')">∞ Kettingreactie</button>
      <button class="intro-topic" onclick="quickChat('filosofie')">💭 Filosofie</button>
      <button class="intro-topic" onclick="quickChat('kunstwerk')">🏛️ Het kunstwerk</button>
      <button class="intro-topic" onclick="quickChat('deelnemers')">🌍 Deelnemers</button>
      <button class="intro-topic" onclick="openChat(); setTimeout(()=>showCard('specs'),200)">📐 Bouwtekening</button>
      <button class="intro-topic" onclick="openChat(); setTimeout(()=>showCard('join'),200)">+ Doe mee</button>
    </div>
  </div>
</div>

<!-- ========== CHAT ========== -->
<div id="chat">
  <div class="chat-header">
    <div class="chat-header-left">
      <span class="chat-header-label">United Wood Floor Layers</span>
      <span class="chat-header-title">Pay It Forward</span>
    </div>
    <button class="header-back" onclick="backToIntro()">← Home</button>
  </div>

  <div class="chat-messages" id="messages">
    <div class="msg ai">
      <div class="msg-av">🪵</div>
      <div class="msg-bub">Wij zijn de beweging — United Wood Floor Layers. Geen bedrijf, geen merk, geen persoon. Stel ons alles wat je wilt weten.</div>
    </div>
  </div>

  <!-- TOPIC BUTTONS — altijd zichtbaar, zoals Nachtwacht -->
  <div class="chat-topics-bar">
    <div class="chat-topics-label">Snelle vragen</div>
    <div class="chat-topics-scroll">
      <button class="chat-topic" onclick="ask('Wat is het Pay It Forward Project precies?')">📋 Wat is dit?</button>
      <button class="chat-topic" onclick="ask('Hoe kan ik meedoen?')">✋ Hoe meedoen?</button>
      <button class="chat-topic" onclick="ask('Wat zijn de maten van het paneel?')">🪵 Het paneel</button>
      <button class="chat-topic" onclick="ask('Wat bedoelen jullie met help 3 mensen?')">🤝 Help 3 mensen</button>
      <button class="chat-topic" onclick="ask('Hoe werkt de kettingreactie?')">∞ Kettingreactie</button>
      <button class="chat-topic" onclick="ask('Wat is de filosofie achter het project?')">💭 Filosofie</button>
      <button class="chat-topic" onclick="ask('Wat gebeurt er met het kunstwerk?')">🏛️ Kunstwerk</button>
      <button class="chat-topic" onclick="ask('Hoeveel deelnemers zijn er en uit welke landen?')">🌍 Deelnemers</button>
      <button class="chat-topic" onclick="showCard('specs')">📐 Bouwtekening</button>
      <button class="chat-topic" onclick="showCard('join')">+ Doe mee</button>
    </div>
  </div>

  <div class="chat-input-wrap">
    <div class="chat-input-row">
      <textarea class="chat-input" id="input" placeholder="Stel je vraag…" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMsg()">↑</button>
    </div>
  </div>
</div>

</div>

<script>
const SYSTEM = `You are the United Wood Floor Layers Pay It Forward Project itself — not a person, not Jakko, but the movement speaking. You speak in first person plural: "we", "us", "our movement". Warm, direct, deeply human. Never corporate. Never about any single individual.

When asked about Jakko Woudenberg: acknowledge him briefly as the initiator, then redirect to the movement. This project is bigger than any one person — including him.

TWO ways to be part of this movement:
1. MAKERS — anyone who makes at least 1 m² panel and helps 3 people. No profession required.
2. PARTICIPANTS ("deelnemer") — anyone who commits to helping 3 people. No panel required.

Key facts:
- Anyone can make a panel — no profession required
- Every maker creates AT LEAST 1 m² panel within 1 year — more is welcome
- Fixed oak windmill (molenwiek) frame, 5 cm wide on all sides, same for every maker
- Inside the frame: complete creative freedom
- Panel: 100×100 cm outer, 90×90 cm freestyle inside, 24mm total (6mm solid wood + 18mm birch plywood), square edged
- Help at least 3 people — practical, emotional or material — runs on trust and conscience
- Those you help pass it on to 3 others — chain reaction of humanity
- The artwork is never sold, eventually donated to a school or public space
- 33 participants from 8 countries: 13 USA, 10 Netherlands, 3 Spain, 2 Belgium, 1 Germany, 1 Italy, 1 Canada, 1 Portugal
- Initiated by Jakko Woudenberg (Dutch Wood Artist)

Answer in the same language as the question. Warm, concise, 2-4 sentences. End with an open question when appropriate.`;

// NAV
function openChat(){ document.getElementById('intro').classList.add('hidden'); document.getElementById('chat').classList.add('active'); }
function backToIntro(){ document.getElementById('chat').classList.remove('active'); document.getElementById('intro').classList.remove('hidden'); }

// Ask from intro
function quickChat(topic){
  openChat();
  const q = {
    project:'Wat is het Pay It Forward Project precies?',
    meedoen:'Hoe kan ik meedoen aan het Pay It Forward Project?',
    paneel:'Hoe maak ik een paneel en wat zijn de regels?',
    '3mensen':'Wat bedoelen jullie precies met help 3 mensen?',
    ketting:'Hoe werkt de kettingreactie van 1 naar 3 naar 9?',
    filosofie:'Wat is de filosofie achter het project?',
    kunstwerk:'Wat gebeurt er uiteindelijk met het kunstwerk?',
    deelnemers:'Hoeveel deelnemers zijn er en uit welke landen komen ze?'
  }[topic];
  if(q) setTimeout(()=>ask(q), 150);
}

// CARDS
function showCard(type){
  const wrap = document.getElementById('messages');
  if(type==='specs'){
    const div = document.createElement('div');

let selRoute = null;
function selectRoute(r){
  selRoute = r;
  document.getElementById('r-maker').classList.toggle('sel', r==='maker');
  document.getElementById('r-participant').classList.toggle('sel', r==='participant');
  document.getElementById('join-fields').style.display = 'block';
  document.getElementById('field-trade').style.display = r==='maker' ? 'block' : 'none';
  document.getElementById('messages').scrollTop = 99999;
}

async function handleSubmit(){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim();
  const country=document.getElementById('f-country').value;
  if(!name||!email||!country){alert('Vul naam, e-mail en land in.');return;}
  if(!selRoute){alert('Kies hoe je wil meedoen.');return;}
  const btn=document.querySelector('.join-submit');
  btn.textContent='Versturen...';btn.disabled=true;
  try{
    await fetch('https://script.google.com/macros/s/AKfycbxp3RB7h1Cg_2eFfenO78dRjuD-l-XTJliibReTWtLopiAz5MfloqVMFDzcS_PgfWI/exec',{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({naam:name,email,land:country,
        type:selRoute==='maker'?'Maker':'Deelnemer',
        vak:document.getElementById('f-trade')?.value||'',
        bericht:document.getElementById('f-msg')?.value||''})
    });
  }catch(e){console.log(e);}
  const wrap=document.getElementById('messages');
  document.getElementById('join-card').remove();
  const ok=document.createElement('div'); ok.className='msg ai';
  ok.innerHTML=`<div class="msg-av">🪵</div><div class="msg-bub">Welkom, ${name}. Jij maakt nu deel uit van een wereldwijde beweging.<br><br>Maak jouw paneel. Help 3 mensen. Geef het door.</div>`;
  wrap.appendChild(ok); wrap.scrollTop=99999;
}

// AI
let hist=[], busy=false;
function ask(q){ document.getElementById('input').value=q; sendMsg(); }
async function sendMsg(){
  const inp=document.getElementById('input');
  const msg=inp.value.trim();
  if(!msg||busy)return;
  inp.value=''; inp.style.height='auto';
  appendMsg('user',msg);
  hist.push({role:'user',content:msg});
  busy=true; document.getElementById('send-btn').disabled=true;
  const tid=appendTyping();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYSTEM,messages:hist})
    });
    const data=await res.json();
    const reply=data.content?.map(b=>b.text||'').join('')||'Er ging iets mis.';
    removeTyping(tid); appendMsg('ai',reply);
    hist.push({role:'assistant',content:reply});
  }catch(e){removeTyping(tid);appendMsg('ai','Verbindingsfout.');}
  busy=false; document.getElementById('send-btn').disabled=false;
}
function appendMsg(role,text){
  const wrap=document.getElementById('messages');
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML=`<div class="msg-av">${role==='ai'?'🪵':'◎'}</div><div class="msg-bub">${text.replace(/\n/g,'<br>')}</div>`;
  wrap.appendChild(d); wrap.scrollTop=99999;
}
let tc=0;
function appendTyping(){
  const id='ty-'+(++tc); const wrap=document.getElementById('messages');
  const d=document.createElement('div'); d.className='msg ai'; d.id=id;
  d.innerHTML='<div class="msg-av">🪵</div><div class="msg-bub"><div class="typing"><span></span><span></span><span></span></div></div>';
  wrap.appendChild(d); wrap.scrollTop=99999; return id;
}
function removeTyping(id){const el=document.getElementById(id);if(el)el.remove();}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px';}
</script>
